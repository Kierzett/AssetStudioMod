name: AssetStudioBuild

on:
  push:
    branches: [ AssetStudioMod ]
  pull_request:
    branches: [ AssetStudioMod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore NuGet packages
        run: nuget restore AssetStudio.sln

      - name: Build .NET Framework 4.7.2
        run: msbuild AssetStudio.sln /p:Configuration=Release /p:TargetFramework=net472 /verbosity:minimal

      - name: Publish .NET 8
        run: dotnet publish AssetStudioGUI/AssetStudioGUI.csproj -c Release -f net8.0-windows

      - name: Publish .NET 9
        run: dotnet publish AssetStudioGUI/AssetStudioGUI.csproj -c Release -f net9.0-windows

      - name: Upload .NET Framework 4.7.2
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio-net472
          path: AssetStudioGUI/bin/Release/net472/
          if-no-files-found: error

      - name: Upload .NET 8
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio-net8
          path: AssetStudioGUI/bin/Release/net8.0-windows/publish/
          if-no-files-found: error

      - name: Upload .NET 9
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio-net9
          path: AssetStudioGUI/bin/Release/net9.0-windows/publish/
          if-no-files-found: error
