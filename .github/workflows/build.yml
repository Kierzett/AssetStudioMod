name: AssetStudioBuild

on:
  push:
    branches: [ AssetStudioMod ]
  pull_request:
    branches: [ AssetStudioMod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v2

      - name: Download FBX SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path fbx
          Set-Location fbx

          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          Start-Process -FilePath ".\fbxsdk.exe" -ArgumentList "/S" -Wait

          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_pdbs.exe" -OutFile "fbxpdb.exe"
          Start-Process -FilePath ".\fbxpdb.exe" -ArgumentList "/S" -Wait

          Set-Location ..

      - name: NuGet Restore
        run: nuget restore AssetStudio.sln

      - name: Restore .NET targets
        run: dotnet restore AssetStudioGUI/AssetStudioGUI.csproj

      - name: Build .NET Framework 4.7.2
        run: msbuild /p:Configuration=Release /p:TargetFramework=net472 /verbosity:minimal

      - name: Build .NET 5
        run: dotnet publish AssetStudioGUI/AssetStudioGUI.csproj -c Release -f net5.0-windows --no-restore

      - name: Build .NET 6
        run: dotnet publish AssetStudioGUI/AssetStudioGUI.csproj -c Release -f net6.0-windows

      - name: Upload .NET Framework 4.7.2
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio-net472
          path: AssetStudioGUI/bin/Release/net472

      - name: Upload .NET 5
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio-net5
          path: AssetStudioGUI/bin/Release/net5.0-windows/publish

      - name: Upload .NET 6
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio-net6
          path: AssetStudioGUI/bin/Release/net6.0-windows/publish
